<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="840" height="190" role="img" aria-label="Dialogue: Selamat datang, traveler! Aku Dani, Backend Artificer penempa API dan penjinak model AI. Mau ikut quest?" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26379f"/>
      <stop offset="1" stop-color="#0a0f45"/>
    </linearGradient>
    <clipPath id="c1">
      <rect x="40" y="70" height="36" width="0">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.28;0.9;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="40" y="112" height="36" width="0">
        <animate attributeName="width" values="0;0;604;604;0" keyTimes="0;0.3;0.58;0.9;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="6" y="26" width="828" height="158" rx="14" fill="url(#win)" stroke="#f4f1ff" stroke-width="3"/>
  <rect x="13" y="33" width="814" height="144" rx="10" fill="none" stroke="#7c8cff" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- name tag -->
  <rect x="30" y="8" width="130" height="32" rx="8" fill="#0a0f45" stroke="#f4f1ff" stroke-width="2"/>
  <text x="95" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="2" fill="#f9d65c">DANI</text>

  <!-- typewriter text -->
  <g font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ffffff">
    <text x="40" y="96" textLength="636" lengthAdjust="spacing" clip-path="url(#c1)">Selamat datang, traveler! Aku Dani, Backend Artificer</text>
    <text x="40" y="138" textLength="600" lengthAdjust="spacing" clip-path="url(#c2)">penempa API dan penjinak model AI. Mau ikut quest?</text>
  </g>

  <!-- "next" cursor -->
  <polygon points="778,146 794,146 786,158" fill="#f9d65c">
    <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,4;0,0" dur="1s" repeatCount="indefinite"/>
  </polygon>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
