name: Generate Contribution Snake

on:
  # jalan otomatis tiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # jalan setiap ada push ke main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2e9e2e&color_dots=#ebedf0,#c9b8ff,#a78bfa,#6d4fc2,#3b2a6b
            dist/snake-dark.svg?color_snake=#8bff6b&color_dots=#161b22,#3b2a6b,#6d4fc2,#a78bfa,#f9d65c

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
